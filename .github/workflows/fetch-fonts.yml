name: Fetch fonts
on:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-fonts.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fonts
          base=https://github.com/google/fonts/raw/main/ofl
          for f in sharetechmono/ShareTechMono-Regular.ttf vt323/VT323-Regular.ttf spacemono/SpaceMono-Bold.ttf spacemono/SpaceMono-Regular.ttf \
                   overpassmono/OverpassMono%5Bwght%5D.ttf cutivemono/CutiveMono-Regular.ttf sharetechmono/OFL.txt; do
            curl -fsSL -o "fonts/$(basename "$f" | sed 's/%5B/[/;s/%5D/]/')" "$base/$f" || echo "missing $f"
          done
          ls -la fonts
          git config user.name "jaytatro"; git config user.email "jaytatro@users.noreply.github.com"
          git add fonts && git commit -m "Fonts for the loading screen (Google Fonts, OFL)" && git push || true
