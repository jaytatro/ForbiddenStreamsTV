name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'gradle.properties', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
          cp app/build/outputs/apk/release/app-release.apk ForbiddenStreamsTV.apk
      - name: Report compile errors
        if: failure()
        run: grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ForbiddenStreamsTV
          path: ForbiddenStreamsTV.apk
      - name: Publish as "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ForbiddenStreamsTV.apk --title "Forbidden Streams TV (build ${{ github.run_number }})" --notes "Install on your Android TV box with the Downloader app."
