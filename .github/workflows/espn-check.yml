name: Maven check
on:
  push:
    branches: [main]
    paths: [".github/workflows/espn-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          v=$(curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "::notice title=jellyfin ffmpeg::$v"
          m=$(curl -s https://dl.google.com/android/maven2/androidx/media3/media3-exoplayer/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "::notice title=media3::$m"
